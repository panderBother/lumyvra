[project]
name = "lumyvra-inference"
version = "0.1.0"
description = "Private full-song inference and production service for Lumyvra"
requires-python = ">=3.11,<3.13"
dependencies = [
  "psutil>=7,<8",
  "fastapi==0.135.3",
  "uvicorn==0.44.0",
  "pydantic-settings==2.14.0",
  "httpx==0.28.1",
  "numpy>=1.26,<3",
  "soundfile==0.13.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.15,<0.16"]
models = ["huggingface-hub>=0.34,<2"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["music_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
